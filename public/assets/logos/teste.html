<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Centralizada</title>
  <style>
    body {
      cursor: default;
      background-color: #d3d3d3; /* Cinza claro */
      display: flex;
      justify-content: center; /* Centraliza horizontalmente */
      align-items: center; /* Centraliza verticalmente */
      height: 100vh; /* Ocupa a altura total da viewport */
      margin: 0;
    }

    img {
      max-width: 95%; /* Garante que a imagem seja responsiva */
      height: auto;
    }
  </style>
</head>
<body>
  <img src="logo_255x80px.svg" alt="Logotipo da empresa">
</body>
</html>
